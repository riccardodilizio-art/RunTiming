# Sito (file statici) + inoltro /api al backend: il browser parla con un solo
# indirizzo, il backend non è esposto su internet.
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── Intestazioni di sicurezza (ripetute nei blocchi che ne aggiungono altre) ───
    # CSP: script solo dal sito, da PayPal (pagamenti) e da Cloudflare (anti-bot).
    # Immagini anche esterne (mappe, foto); stili inline necessari alla mappa.
    set $csp "default-src 'self'; script-src 'self' https://www.paypal.com https://*.paypal.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://challenges.cloudflare.com; frame-src https://*.paypal.com https://challenges.cloudflare.com https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self \"https://www.paypal.com\")" always;
    # HSTS: il sito va solo in https (attivo quando servito in https, es. dietro Cloudflare)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → backend (stesso indirizzo del sito)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # classifiche Race Result (la dimensione la controlla il backend)
        client_max_body_size 30m;
    }

    # SPA fallback: ogni route serve index.html (mai in cache: dopo un aggiornamento
    # il browser carica subito la versione nuova)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Pagina per scegliere la nuova password: il link contiene il token → mai inviato ad altri siti
    location = /reimposta-password {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # asset con hash → cache lunga e immutabile
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # endpoint di liveness banale
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
