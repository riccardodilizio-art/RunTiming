# Sito (file statici) + inoltro /api al backend: il browser parla con un solo
# indirizzo, il backend non è esposto su internet.
include /etc/nginx/snippets/cloudflare-realip.conf;

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolver di Docker: l'indirizzo del backend si rilegge, così riavviare solo
    # il backend non lascia nginx a puntare al vecchio container (errori 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → backend (stesso indirizzo del sito)
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP reale del visitatore (dopo real_ip): sovrascrive quello inviato dal browser
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # classifiche Race Result (la dimensione la controlla il backend)
        client_max_body_size 30m;
    }

    # SPA fallback: ogni route serve index.html (mai in cache: dopo un aggiornamento
    # il browser carica subito la versione nuova)
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Pagina per scegliere la nuova password: il link contiene il token → mai inviato ad altri siti
    location = /reimposta-password {
        # rewrite … break: serve index.html restando in questo blocco (con le sue intestazioni)
        rewrite ^ /index.html break;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    # asset con hash → cache lunga e immutabile
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # endpoint di liveness banale
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
