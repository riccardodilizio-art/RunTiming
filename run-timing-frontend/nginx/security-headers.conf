# Intestazioni di sicurezza. Incluso in OGNI location che aggiunge altre
# intestazioni: in nginx un add_header nel blocco annulla quelli ereditati.
# CSP: script solo dal sito, da PayPal (pagamenti) e da Cloudflare (anti-bot);
# immagini anche esterne (mappe, foto); stili inline necessari alla mappa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com https://challenges.cloudflare.com; frame-src https://*.paypal.com https://*.paypalobjects.com https://challenges.cloudflare.com https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self \"https://www.paypal.com\")" always;
# HSTS: il sito va solo in https (attivo quando servito in https, es. dietro Cloudflare)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
