# Stack di SVILUPPO sul proprio PC: db + backend + frontend.
# Per il server usare docker-compose.prod.yml (vedi istruzioni lì dentro).
# Le porte sono aperte solo su questo PC (127.0.0.1), non sulla rete.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runtiming
      POSTGRES_PASSWORD: runtiming
      POSTGRES_DB: runtiming
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtiming"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://runtiming:runtiming@db:5432/runtiming
      # Segreto per firmare i login: OBBLIGATORIO, casuale, almeno 32 caratteri,
      # nel .env di root (il backend non parte con valori deboli). Generalo con:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      JWT_SECRET: ${JWT_SECRET:?Imposta JWT_SECRET nel file .env (vedi .env.example)}
      # Proxy davanti al backend: 1 = solo nginx, 2 = Cloudflare + nginx (qui: nessuno)
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Limite generale di richieste al minuto per IP
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-300}
      # Anti-bot Cloudflare Turnstile (facoltativo): senza chiave è disattivato
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Email (Amazon SES, datacenter di Milano). Senza chiavi le email restano
      # in coda come "disabled" e il sito funziona lo stesso.
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Segreteria – TimingRun}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      AWS_REGION: ${AWS_REGION:-eu-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Admin iniziale (dal .env di root): ADMIN_EMAIL=... ADMIN_PASSWORD=...
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Dati demo: `docker compose exec backend node dist/seed.js` (solo ambiente locale)
      ALLOW_DEMO_SEED: "true"
      # Sviluppo locale: aggiorna lo schema del DB senza fermarsi (MAI in produzione)
      DB_PUSH_ACCEPT_DATA_LOSS: "true"
      # Pagamenti PayPal (dal .env di root): sandbox per le prove
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
      # Integrazione FIDAL/WISE. Le credenziali arrivano dal file .env di root
      # (git-ignored): crealo con WISE_USERNAME=... e WISE_PASSWORD=...
      WISE_BASE_URL: http://wise.fidalservizi.it
      WISE_USERNAME: ${WISE_USERNAME:-}
      WISE_PASSWORD: ${WISE_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]

  frontend:
    build:
      context: ./run-timing-frontend
      args:
        # Vuoto = il sito chiama /api sullo stesso indirizzo (nginx lo inoltra al backend)
        VITE_API_URL: ""
        # Metti VITE_USE_API=true nel .env di root per far usare al sito la
        # verifica FIDAL in tempo reale via backend (default: dataset locale).
        VITE_USE_API: ${VITE_USE_API:-false}
        # Chiave pubblica Turnstile (facoltativa, va in coppia con TURNSTILE_SECRET_KEY)
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]

volumes:
  pgdata:
